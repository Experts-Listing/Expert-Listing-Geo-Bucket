name: CI

on:
  pull_request:
    branches: [dev, stage, prod]
  push:
    branches: [dev, stage, prod]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SERVICE: geo-bucket
  ECR_REPOSITORY: expert-listing/geo-bucket
  GHCR_IMAGE: ghcr.io/experts-listing/geo-bucket
  INFRA_REPOSITORY: Infra-Service
  TRIVY_VERSION: v0.74.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks (full history)
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --verbose --exit-code 1

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Trivy filesystem gate (fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  image:
    needs: [test, lint, secret-scan, trivy-fs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      registry: ${{ steps.push.outputs.registry }}
      repository: ${{ steps.push.outputs.repository }}
      tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.SERVICE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.SERVICE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '0'
      - name: Trivy image gate (fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          skip-setup-trivy: true
          image-ref: ${{ env.SERVICE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Push image to GHCR and ECR
        if: github.event_name == 'push'
        id: push
        env:
          LOCAL_IMAGE: ${{ env.SERVICE }}:${{ github.sha }}
          TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker tag "$LOCAL_IMAGE" "$GHCR_IMAGE:$TAG"
          docker push "$GHCR_IMAGE:$TAG"

          # ECR tags are immutable: the same SHA pushed from another branch (promotion or a parallel run) is reused as-is.
          image_exists() { aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$TAG" >/dev/null 2>&1; }
          if image_exists; then
            echo "$ECR_REPOSITORY:$TAG already exists in ECR, skipping push"
          else
            docker tag "$LOCAL_IMAGE" "$ECR_REGISTRY/$ECR_REPOSITORY:$TAG"
            docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$TAG" || image_exists
          fi

          echo "registry=$ECR_REGISTRY" >> "$GITHUB_OUTPUT"
          echo "repository=$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
          {
            echo "### Published images"
            echo "- \`$GHCR_IMAGE:$TAG\`"
            echo "- \`$ECR_REGISTRY/$ECR_REPOSITORY:$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

  trigger-deploy:
    needs: image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy event
        env:
          GH_TOKEN: ${{ secrets.INFRA_DISPATCH_TOKEN }}
          ENVIRONMENT: ${{ github.ref_name }}
          REGISTRY: ${{ needs.image.outputs.registry }}
          REPOSITORY: ${{ needs.image.outputs.repository }}
          TAG: ${{ needs.image.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg service "$SERVICE" \
            --arg environment "$ENVIRONMENT" \
            --arg registry "$REGISTRY" \
            --arg repository "$REPOSITORY" \
            --arg tag "$TAG" \
            --arg commit "$GITHUB_SHA" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg source_run_url "$RUN_URL" \
            '{event_type: "deploy", client_payload: {service: $service, environment: $environment, registry: $registry, repository: $repository, tag: $tag, commit: $commit, source_repository: $source_repository, source_run_url: $source_run_url}}' \
            | tee payload.json
          gh api "repos/$GITHUB_REPOSITORY_OWNER/$INFRA_REPOSITORY/dispatches" --method POST --input payload.json
          echo "Deploy of \`$SERVICE:$TAG\` to **$ENVIRONMENT** requested in $GITHUB_REPOSITORY_OWNER/$INFRA_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: [test, lint, secret-scan, trivy-fs, image, trigger-deploy]
    if: always()
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      NEEDS: ${{ toJSON(needs) }}
      EVENT: ${{ github.event_name }}
      REF: ${{ github.head_ref || github.ref_name }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      IMAGE: ${{ needs.image.outputs.registry }}/${{ needs.image.outputs.repository }}:${{ needs.image.outputs.tag }}
    steps:
      - name: Build Slack message
        id: message
        run: |
          failed=$(jq -r '[to_entries[] | select(.value.result == "failure") | .key] | join(", ")' <<<"$NEEDS")
          deployed=$(jq -r '.["trigger-deploy"].result' <<<"$NEEDS")
          context="$EVENT"
          [ -n "$PR_NUMBER" ] && context="PR #$PR_NUMBER"

          if [ -n "$failed" ]; then
            text=":x: *$GITHUB_REPOSITORY* CI failed on \`$REF\` ($context) by $GITHUB_ACTOR"$'\n'"Failed jobs: $failed"$'\n'"Commit: \`${GITHUB_SHA::7}\` · <$RUN_URL|View run>"
          elif [ "$deployed" = "success" ]; then
            text=":rocket: *$GITHUB_REPOSITORY* published \`$IMAGE\`"$'\n'"Deploy to *$REF* triggered in $GITHUB_REPOSITORY_OWNER/$INFRA_REPOSITORY · <$RUN_URL|View run>"
          else
            echo "send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          jq -n --arg text "$text" '{text: $text}' > slack.json
          echo "send=true" >> "$GITHUB_OUTPUT"

      - name: Send to Slack
        if: steps.message.outputs.send == 'true' && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: slack.json
